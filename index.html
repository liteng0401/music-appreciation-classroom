<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高中音乐鉴赏 · 互动课堂</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --ink:#23303a; --muted:#6b7780; --line:#e3ddd0;
    --brand:#c0392b; --brand2:#16638a; --accent:#f0b429; --ok:#2e8b57; --bad:#c0392b;
    --chip:#eef2f4;
    --side-w:300px;          /* 侧栏宽度；目录开关箭头的位置也跟它走，只改这一处 */
  }
  [data-theme="dark"]{
    --bg:#1b1f24; --panel:#252b31; --ink:#e8edf1; --muted:#9aa6ad; --line:#39424a;
    --brand:#e35b4c; --brand2:#4aa3cf; --accent:#f0b429; --ok:#56c08a; --bad:#e35b4c;
    --chip:#2e353c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
  .app{display:flex;height:100vh;position:relative}
  /* 侧栏 */
  .side{width:var(--side-w);min-width:var(--side-w);background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px}
  .brand{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:10px 9px;margin:2px 0 8px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .brand-logo{width:70px;height:auto;display:block;flex:0 0 auto}
  .brand-name{flex:1 1 auto;min-width:0;width:auto;height:auto;display:block}
  .side h1{font-size:17px;margin:6px 8px 4px;color:var(--brand)}
  .side .sub{font-size:12px;color:var(--muted);margin:0 8px 12px}
  /* 目录分级：序篇 / 上篇 / 下篇 三个可收起展开的分组标题 */
  .grp-sec{margin:8px 2px 0}
  .grp{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:transparent;border:0;
    color:var(--brand2);font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.5px;
    padding:9px 8px;border-radius:9px;cursor:pointer;margin:0 0 2px}
  .grp:hover{background:var(--chip)}
  .grp .chev{width:12px;height:12px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.8;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
  .grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
  .grp .grp-t{flex:1 1 auto;min-width:0}
  .grp .grp-n{flex:0 0 auto;font-size:11px;font-weight:600;letter-spacing:0;color:var(--muted);
    background:var(--chip);border-radius:20px;padding:1px 8px}
  .grp:hover .grp-n{background:var(--panel)}
  /* 收起/展开用 display 切换（两个状态都显式写了样式）：
     不用 max-height 动画，是因为字号被放大时内容会超过阈值被永久裁掉；
     展开/收起的反馈由标题上那个旋转的箭头提供。 */
  .grp-body{display:block}
  .grp-body.collapsed{display:none}
  .navbtn{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--ink);
    padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;margin:2px 0;line-height:1.35}
  .navbtn:hover{background:var(--chip)}
  .navbtn.active{background:var(--brand);color:#fff}
  .navbtn.active .tag{opacity:.85}
  .navbtn .tag{font-size:11px;opacity:.7;display:block}
  .tools{margin:14px 8px 4px;display:flex;gap:8px;flex-wrap:wrap}
  .tools button{font-size:12px;padding:6px 10px;border:1px solid var(--line);background:var(--chip);border-radius:8px;cursor:pointer;color:var(--ink)}
  /* 主区 */
  .main{flex:1;overflow:auto;padding:26px 40px 80px}
  .wrap{max-width:920px;margin:0 auto}
  .uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--brand);padding-bottom:10px;margin-bottom:18px}
  .uhead h2{margin:0;font-size:24px}
  .uhead .grp-l{font-size:13px;color:var(--brand2);background:var(--chip);padding:2px 10px;border-radius:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h3{margin:0 0 10px;font-size:18px;color:var(--brand2);display:flex;align-items:center;gap:8px}
  .card h3::before{content:"";width:6px;height:18px;background:var(--accent);border-radius:3px;display:inline-block}
  .core{background:linear-gradient(135deg,#fff7ec,#fff);border-left:5px solid var(--accent);font-size:16px}
  .term{margin:10px 0;padding:10px 14px;background:var(--chip);border-radius:10px}
  .term b{color:var(--brand)}
  .term .d{display:block;margin-top:3px;color:var(--ink)}
  .term .dt{display:block;margin-top:5px;font-size:13px;color:var(--muted)}
  ul.clean{margin:6px 0;padding-left:20px}
  ul.clean li{margin:5px 0}
  .works{display:grid;grid-template-columns:1fr;gap:8px}
  .work{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--chip);display:flex;align-items:center;gap:10px;justify-content:space-between}
  .work .meta{min-width:0}
  .work .n{font-weight:700}
  .work .a{font-size:13px;color:var(--muted);margin-top:2px}
  .work .play{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;border:0;border-radius:20px;padding:7px 15px;font-size:13px;cursor:pointer;color:#fff;background:var(--brand2);font-family:inherit}
  .work .play:hover{filter:brightness(1.08)}
  .work .play.playing{background:var(--brand)}
  #audioBar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:70;display:none;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:30px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:9px 16px;max-width:92vw}
  #audioBar .ttl{font-size:13px;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #audioBar button{border:0;background:var(--brand);color:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:13px;font-family:inherit}
  /* 配套资源 */
  .res-sub{font-size:13px;color:var(--muted);margin:14px 0 6px}
  .res-sub:first-child{margin-top:2px}
  .res-list{display:grid;grid-template-columns:1fr;gap:8px}
  .res-item{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--chip);display:flex;align-items:center;gap:10px;justify-content:space-between}
  .res-item .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
  .res-item .sz{flex:0 0 auto;font-size:12px;color:var(--muted)}
  .res-item .rbtn{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;border:1px solid var(--brand2);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--brand2);background:transparent;font-family:inherit;text-decoration:none;transition:.15s}
  .res-item .rbtn:hover{background:var(--brand2);color:#fff}
  .res-tip{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.7}
  /* 整单元课件打包（微云镜像） */
  .zip-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--brand2);border-radius:12px;padding:11px 14px;margin-top:12px;background:var(--chip)}
  .zip-btn{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;border:0;border-radius:20px;padding:9px 20px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;background:var(--brand2);font-family:inherit;text-decoration:none}
  .zip-btn:hover{filter:brightness(1.08)}
  .zip-note{font-size:12px;color:var(--muted);line-height:1.65;flex:1 1 220px;min-width:0}
  /* 补充资料区（教师投稿） */
  .sup-sub{font-size:13px;color:var(--muted);margin:2px 0 10px}
  .sup-list{display:grid;grid-template-columns:1fr;gap:8px}
  .sup-item{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--chip);display:flex;align-items:center;gap:10px}
  .sup-badge{flex:0 0 auto;font-size:11px;padding:3px 10px;border-radius:20px;color:#fff;letter-spacing:.5px;white-space:nowrap}
  .sup-badge.audio{background:var(--brand2)}
  .sup-badge.video{background:#8e44ad}
  .sup-badge.ppt{background:var(--accent);color:#4a3500}
  .sup-badge.text{background:var(--ok)}
  .sup-meta{flex:1 1 auto;min-width:0}
  .sup-n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sup-a{font-size:12px;color:var(--muted);margin-top:2px}
  .sup-note{grid-column:1/-1;font-size:14px;color:var(--ink);background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:11px 14px;line-height:1.8}
  .sup-empty{font-size:13px;color:var(--muted);background:var(--chip);border-radius:9px;padding:11px 14px;line-height:1.7}
  .sup-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
  .sup-submit{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:20px;padding:8px 18px;font-size:14px;cursor:pointer;color:#fff;background:var(--brand);font-family:inherit;text-decoration:none}
  .sup-submit:hover{filter:brightness(1.08)}
  .sup-dead{font-size:13px;color:var(--muted);background:var(--chip);border-radius:20px;padding:7px 16px}
  .sup-toggle{flex:0 0 auto;border:1px solid var(--brand2);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--brand2);background:transparent;font-family:inherit;text-decoration:none;transition:.15s}
  .sup-toggle:hover{background:var(--brand2);color:#fff}
  /* 测验 */
  .quiz .q{margin:18px 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .qnote{font-size:13px;color:var(--muted);margin:-2px 0 8px;line-height:1.6}
  .q .qtag{display:inline-block;font-size:12px;font-weight:400;color:var(--brand2);background:var(--chip);border-radius:6px;padding:2px 7px;margin-right:8px;vertical-align:1px}
  .qaplay{display:inline-block;margin:0 0 8px;font-size:13px;padding:6px 12px;border:0;border-radius:8px;background:var(--brand2);color:#fff;cursor:pointer}
  .exam-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
  .exam-timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:20px;color:var(--brand2)}
  .exam-timer.warn{color:var(--bad)}
  .exam-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .exam-grid button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-size:13px;color:var(--ink)}
  .exam-grid button.done{background:var(--chip);border-color:var(--brand2)}
  .exam-grid button.right{background:#e8f6ee;border-color:var(--ok)}
  .exam-grid button.wrong{background:#fce9e7;border-color:var(--bad)}
  .exam-result{font-size:15px;line-height:1.9}
  .q .qt{font-weight:600;margin-bottom:10px}
  .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer;color:var(--ink);font-size:15px}
  .opt:hover{border-color:var(--brand2)}
  .opt.sel{border-color:var(--brand);background:#fff1ee}
  .opt.right{background:#e8f6ee;border-color:var(--ok)}
  .opt.wrong{background:#fce9e7;border-color:var(--bad)}
  /* 深色主题下这几处原来硬编码了浅色底（浅底 + 浅字 = 看不清），换成深色底 */
  [data-theme="dark"] .core{background:linear-gradient(135deg,#2b3238,#252b31)}
  [data-theme="dark"] .opt.sel{background:#4a2c28}
  [data-theme="dark"] .opt.right{background:#1d3a2a}
  [data-theme="dark"] .opt.wrong{background:#40242a}
  [data-theme="dark"] .exam-grid button.right{background:#1d3a2a}
  [data-theme="dark"] .exam-grid button.wrong{background:#40242a}
  .q .ex{margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:9px;font-size:14px;display:none}
  .q .ex.show{display:block}
  .qbtns{margin-top:8px;display:flex;gap:10px}
  .qbtns button{font-size:13px;padding:7px 14px;border:0;border-radius:8px;cursor:pointer}
  .submit{background:var(--brand);color:#fff}
  .next{background:var(--brand2);color:#fff;display:none}
  .score{font-size:15px;font-weight:700;color:var(--brand2);margin:10px 0}
  .progress{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  /* 速查 */
  .gloss{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .gloss .g{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel)}
  .gloss .g b{color:var(--brand)}
  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:15px;margin-bottom:12px}
  .note{color:var(--muted);font-size:13px;background:var(--chip);padding:8px 12px;border-radius:8px}
  table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--chip)}
  .hidden{display:none !important}
  /* 注意：.hidden 必须带 !important。
     下面 .note-panel / .sup-note 等规则也声明了 display，且位置更靠后，
     同优先级下后者覆盖前者，会让 hidden 失效（2026-09-22 课堂便签实测踩过）。 */
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;position:relative;z-index:30}
  /* ── 目录开关：贴在目录右缘的小箭头（像 Safari 的边栏拉手）─────────────────
     它 position:absolute 挂在 .app 上，left 永远等于侧栏右边缘：
       展开 → left:var(--side-w)（贴在目录内侧边上）
       收起 → left:0（留在屏幕最左边，点一下就拉回来）
     桌面和手机用同一套规则，只靠 .app.side-hidden 一个类切换，
     避免再出现"某种宽度下点了没反应"（2026-09-22 踩过的坑）。 */
  #sideToggle{position:absolute;left:var(--side-w);top:22px;z-index:40;
    width:20px;height:54px;padding:0;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line);border-left:0;border-radius:0 11px 11px 0;
    background:var(--panel);color:var(--muted);cursor:pointer;font-family:inherit;
    box-shadow:2px 1px 7px rgba(0,0,0,.08);
    transition:left .2s ease,background .15s,color .15s,border-color .15s}
  #sideToggle:hover{background:var(--brand2);border-color:var(--brand2);color:#fff}
  #sideToggle svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
  .app.side-hidden #sideToggle{left:0}
  .app.side-hidden #sideToggle svg{transform:rotate(180deg)}
  /* 手机端侧栏展开时的遮罩：点空白也能关，层级要低于侧栏(20)和箭头(40) */
  #sideBackdrop{display:none;border:0;padding:0}
  /* 桌面端：侧栏可整体收起，把宽度让给正文 */
  @media (min-width:761px){ .app.side-collapsed .side{display:none} }
  @media (max-width:760px){.side{position:fixed;z-index:20;height:100%;transform:translateX(-100%);transition:.2s}
    .side.open{transform:none}
    /* 左边留出箭头的宽度，别让箭头压住正文首字 */
    .main{padding:18px 16px 80px 26px}
    #sideToggle{top:16px;height:50px}
    #sideBackdrop.show{display:block;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.38);cursor:pointer}}
  /* 校本便签（全局悬浮） */
  .note-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:80;font-family:inherit}
  .note-fab-btn{width:54px;height:54px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.28)}
  .note-panel{position:absolute;right:0;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:300px;max-height:min(70vh,520px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.2);padding:12px;display:flex;flex-direction:column;gap:8px}
  .note-head{font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .note-mini-grp{display:flex;gap:6px;flex:0 0 auto}
  .note-mini{font-size:12px;padding:3px 9px;border:1px solid var(--line);background:var(--chip);border-radius:7px;cursor:pointer;color:var(--ink)}
  #noteArea{width:100%;height:150px;resize:vertical;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit;line-height:1.6}
  .note-foot{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .note-saved{color:var(--ok);font-weight:600}
  @media (max-width:760px){.note-panel{width:calc(100vw - 36px);max-height:min(58vh,420px)}#noteArea{height:104px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <img class="brand-logo" src="school-logo.png" alt="河北峰峰第一中学校徽">
      <img class="brand-name" src="school-name.png" alt="河北峰峰第一中学校名">
    </div>
    <h1>🎵 音乐鉴赏 · 互动课堂</h1>
    <div class="sub">人音版必修《音乐鉴赏》2019 · 课堂教学</div>
    <div class="tools">
      <button onclick="showView('home')">🏠 总览</button>
      <button onclick="showView('gloss')">🔤 术语速查</button>
      <button onclick="showView('cheat')">📊 对比速查</button>
      <button onclick="showView('exam')">🎯 学考模拟</button>
    </div>
    <div id="nav"></div>
    <div class="tools"><button id="themeBtn">🌓 切换深色</button></div>
  </aside>
  <button id="sideBackdrop" type="button" aria-label="关闭目录"></button>
  <button id="sideToggle" type="button" onclick="toggleSide()" aria-expanded="true" aria-controls="side" aria-label="收起目录" title="收起目录">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
  </button>

  <main class="main">
    <div class="wrap">
      <div class="topbar">
        <div id="crumb" style="color:var(--muted);font-size:13px"></div>
      </div>
      <div id="content"></div>
    </div>
  </main>
</div>

  <!-- 校本便签 -->
  <div class="note-fab">
    <div id="notePanel" class="note-panel hidden">
      <div class="note-head"><span>📝 课堂便签</span><span class="note-mini-grp"><button id="noteClear" class="note-mini">清空</button><button id="noteClose" class="note-mini">✕ 关闭</button></span></div>
      <textarea id="noteArea" placeholder="上课随手记：本校补充、重点提醒、学生表现……（仅保存在本机浏览器）"></textarea>
      <div class="note-foot"><span id="noteSaved"></span><span>自动保存</span></div>
    </div>
    <button id="noteToggle" class="note-fab-btn" title="课堂便签">📝</button>
  </div>

  <!-- 底部浮动播放条 -->
  <div id="audioBar"><span class="ttl" id="abTitle"></span><button onclick="stopAudio()">⏹ 停止</button></div>

<script src="data.js"></script>
<script src="audio.js"></script>
<script src="audio_extra.js"></script>
<script src="resources.js"></script>
<script src="ppt_mirror.js"></script>
<script src="exam_bank.js"></script>
<script src="supplementary.js"></script>
<script>
const D = window.COURSE_DATA;
const $ = (s,el=document)=>el.querySelector(s);
const crumb = $("#crumb");

// ─────────────────────────────────────────────────────────────────────────────
// 课件 PPT 下载走 GitHub 加速镜像（2026-09-22 实测）
// 学校网络打不开 github.com（Release 附件实测超时），但把原始链接拼在镜像域名后面
// 就能国内直连下载：52 个附件实测全部可用、整文件 SHA-256 与源文件一致、支持断点续传，
// 速度约 330 KB/s（22MB ≈ 72 秒）。
// ⚠️ 这是第三方公共服务，不由我们控制，哪天限速或停掉都有可能。要换镜像 / 临时关掉，
//    只改下面这一行即可：改成 "" 就退回 GitHub 原始直链（需要科学上网）。
const DL_MIRROR = "https://ghproxy.net/";
const mirror = u => (DL_MIRROR && /^https:\/\/github\.com\//i.test(u||"")) ? DL_MIRROR + u : (u||"");

// ── 目录分级 ───────────────────────────────────────────────────────────────────
// 三大篇（序篇 / 上篇 / 下篇）各是一个可收起、可展开的分组，状态记在本机浏览器里。
// 默认全部收起：一眼先看清"整册分三篇"这个层级，点开哪一篇才列出该篇的单元。
const NAV_GRP_KEY = "ma-nav-groups";
const GRP_LABEL = {"序篇":"序篇","上篇":"上篇（第一—八单元）","下篇":"下篇（第九—十八单元）"};
let navGroups = (()=>{ try{ return JSON.parse(localStorage.getItem(NAV_GRP_KEY)) || {}; }catch(e){ return {}; } })();
function saveNavGroups(){ try{ localStorage.setItem(NAV_GRP_KEY, JSON.stringify(navGroups)); }catch(e){} }
function setNavGroup(g, open){
  navGroups[g] = !!open; saveNavGroups();
  const h = document.querySelector(`#nav .grp[data-grp="${g}"]`);
  const body = document.getElementById("grp-" + g);
  if(h) h.setAttribute("aria-expanded", open ? "true" : "false");
  if(body) body.classList.toggle("collapsed", !open);
}
function toggleNavGroup(g){ setNavGroup(g, !navGroups[g]); }

function buildNav(){
  const nav = $("#nav");
  const order = ["序篇","上篇","下篇"];
  const seq = {"序篇":[],"上篇":[],"下篇":[]};
  D.units.forEach(u=>seq[u.group].push(u));
  order.forEach(g=>{
    if(!seq[g].length) return;
    const sec = document.createElement("div"); sec.className = "grp-sec";
    const h = document.createElement("button");
    h.type = "button"; h.className = "grp"; h.dataset.grp = g;
    h.setAttribute("aria-expanded", navGroups[g] ? "true" : "false");
    h.setAttribute("aria-controls", "grp-" + g);
    h.innerHTML = `<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`
                + `<span class="grp-t">${GRP_LABEL[g] || g}</span>`
                + `<span class="grp-n">${seq[g].length}</span>`;
    h.onclick = () => toggleNavGroup(g);
    const body = document.createElement("div");
    body.className = "grp-body" + (navGroups[g] ? "" : " collapsed");
    body.id = "grp-" + g;
    seq[g].forEach(u=>{
      const b=document.createElement("button");
      b.className="navbtn"; b.dataset.id=u.id;
      b.innerHTML = u.title.replace(/（.*$/,'') + `<span class="tag">${u.id.toUpperCase()}</span>`;
      b.onclick=()=>{showUnit(u.id); closeSide();};
      body.appendChild(b);
    });
    sec.appendChild(h); sec.appendChild(body); nav.appendChild(sec);
  });
}

// 高亮当前单元；它若在收起的那一篇里，就顺手把那一篇展开
// （从「总览 › 全书结构」的链接点进来时必须靠这个，否则侧栏看不出自己在哪）
function markNav(id){
  let hit = null;
  document.querySelectorAll("#nav .navbtn").forEach(b=>{
    const on = !!id && b.dataset.id === id;
    b.classList.toggle("active", on);
    if(on) hit = b;
  });
  if(hit){
    const body = hit.parentElement;
    const g = ((body && body.id) || "").replace(/^grp-/,"");
    if(g && !navGroups[g]) setNavGroup(g, true);
  }
}

function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

let curAudio=null, curBtn=null;
function setPlayBtn(b){ if(curBtn&&curBtn!==b){curBtn.classList.remove('playing');curBtn.textContent='▶ 播放';} curBtn=b; }
function barShow(on, title){
  const bar=$("#audioBar"), t=$("#abTitle");
  if(t && typeof title==='string') t.textContent = title ? ('🎵 '+title) : '';
  if(bar) bar.style.display = on ? 'flex' : 'none';
}
function playSrc(src, title, btn){
  if(!src || !btn) return;
  if(curBtn===btn && curAudio && !curAudio.paused){
    curAudio.pause(); btn.textContent='▶ 播放'; btn.classList.remove('playing'); barShow(false,''); return;
  }
  if(!curAudio){
    curAudio = new Audio();
    curAudio.addEventListener('ended', ()=>{ setPlayBtn(null); barShow(false,''); });
  }
  document.querySelectorAll('.play.playing').forEach(b=>{b.classList.remove('playing');b.textContent='▶ 播放';});
  curAudio.pause();
  curAudio.src = src;
  curAudio.play().then(()=>{
    setPlayBtn(btn); btn.classList.add('playing'); btn.textContent='⏸ 暂停';
    barShow(true, String(title||'').replace(/[《》]/g,''));
  }).catch(e=>alert('播放失败：'+e.message));
}
function playWork(key, btn){
  const src = window.AUDIO_MAP && window.AUDIO_MAP[key];
  if(!src) return;
  playSrc(src, key.split('|')[1], btn);
}
function playExtra(uid, i, btn){
  const arr = (window.AUDIO_EXTRA && window.AUDIO_EXTRA[uid]) || [];
  if(arr[i]) playSrc(arr[i].path, arr[i].name, btn);
}
function stopAudio(){ if(curAudio) curAudio.pause(); setPlayBtn(null); barShow(false,''); }

/* ---------- 补充资料区（教师投稿） ---------- */
const SUP_TYPE = {audio:"音频", video:"视频", ppt:"PPT", text:"文本"};
/* 投稿内容来自外部（问卷），一律转义 + 只放行 http(s) 链接 */
function supEsc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function supUrl(u){u=String(u==null?"":u).trim();return /^https?:\/\//i.test(u)?u:"";}
function supOf(uid){const S=window.SUPPLEMENTARY||{};return (S.units&&S.units[uid])||[];}
function playSup(uid,i,btn){
  const it=supOf(uid)[i]; if(!it) return;
  const src=supUrl(it.url); if(!src) return;
  playSrc(src, it.title, btn);
}
function toggleSup(uid,i,btn){
  const el=document.getElementById('supnote-'+uid+'-'+i); if(!el) return;
  el.classList.toggle('hidden');
  btn.textContent = el.classList.contains('hidden') ? '展开阅读' : '收起';
}
function supportCard(uid){
  const S=window.SUPPLEMENTARY||{}, sub=S.submit||{};
  const list=supOf(uid);
  const rows=list.map((it,i)=>{
    const t=SUP_TYPE[it.t]?it.t:'text', label=SUP_TYPE[t];
    const url=supUrl(it.url);
    const meta=`<div class="sup-meta"><div class="sup-n">${supEsc(it.title)||'（未命名）'}</div>`
      +`<div class="sup-a">${[it.by?('投稿：'+it.by):'',it.size||'',it.date||''].filter(Boolean).map(supEsc).join(' · ')||'教师投稿'}</div></div>`;
    let action='';
    if(t==='audio' && url) action=`<button class="play" onclick="playSup('${supEsc(uid)}',${i},this)">▶ 播放</button>`;
    else if(t==='video' && url) action=`<a class="sup-toggle" href="${supEsc(url)}" target="_blank" rel="noopener">▶ 播放 ↗</a>`;
    else if(t==='ppt' && url) action=`<a class="sup-toggle" href="${supEsc(url)}" target="_blank" rel="noopener" download>下载 ↗</a>`;
    else if(t==='text') action=`<button class="sup-toggle" onclick="toggleSup('${supEsc(uid)}',${i},this)">展开阅读</button>`;
    else action=`<span class="sup-a">链接待补</span>`;
    let extra='';
    if(t==='text'){
      const body=supEsc(it.note).replace(/\n/g,'<br>');
      extra=`<div class="sup-note hidden" id="supnote-${supEsc(uid)}-${i}">${body||'（暂无正文）'}`
        +(url?`<div style="margin-top:8px"><a href="${supEsc(url)}" target="_blank" rel="noopener" style="color:var(--brand2)">查看原文 ↗</a></div>`:'')+`</div>`;
    }else if(it.note){
      extra=`<div class="sup-note">${supEsc(it.note).replace(/\n/g,'<br>')}</div>`;
    }
    return `<div class="sup-item"><span class="sup-badge ${t}">${label}</span>${meta}${action}</div>${extra}`;
  }).join('');
  const submitUrl=supUrl(sub.url);
  const cta=submitUrl
    ? `<a class="sup-submit" href="${supEsc(submitUrl)}" target="_blank" rel="noopener">＋ 提交补充材料</a>`
    : `<span class="sup-dead">投稿入口尚未开放</span>`;
  return `<div class="card"><h3>🗂 补充资料区</h3>`
    +`<div class="sup-sub">教师投稿 · 本单元共 ${list.length} 项</div>`
    +(list.length?`<div class="sup-list">${rows}</div>`
      :`<div class="sup-empty">本单元暂无补充材料。欢迎把好用的音频、视频、PPT 或文字资料投到这里，审核后会展示给全组老师。</div>`)
    +`<div class="sup-actions">${cta}</div>`
    +(sub.tip?`<div class="res-tip">${supEsc(sub.tip)}</div>`:'')
    +`</div>`;
}

function termCard(t){
  return `<div class="term"><b>${esc(t.term)}</b><span class="d">${esc(t.def)}</span>${t.detail?`<span class="dt">${esc(t.detail).replace(/\n/g,'<br>')}</span>`:''}</div>`;
}

function showUnit(id){
  const u = D.units.find(x=>x.id===id);
  crumb.textContent = `${u.group} › ${u.title.replace(/（.*$/,'')}`;
  let h = `<div class="uhead"><span class="grp-l">${u.group}</span><h2>${esc(u.title)}</h2></div>`;
  h += `<div class="card core"><h3>本节要点</h3>${esc(u.core)||"（见正文）"}</div>`;

  if(u.frameworks.length){
    h += `<div class="card"><h3>📐 核心框架 / 概念</h3>${u.frameworks.map(termCard).join("")}</div>`;
  }
  if(u.concepts.length){
    h += `<div class="card"><h3>🔑 关键术语</h3>${u.concepts.map(termCard).join("")}</div>`;
  }
  if(u.mental.length){
    h += `<div class="card"><h3>🧠 鉴赏思路</h3><ul class="clean">${u.mental.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`;
  }
  if(u.works.length){
    h += `<div class="card"><h3>🎼 本课作品鉴赏</h3><div class="works">${u.works.map(w=>{
      const key=u.id+"|"+w.name;
      const src=(window.AUDIO_MAP&&window.AUDIO_MAP[key])||"";
      const meta=`<div class="meta"><div class="n">《${esc(w.name.replace(/[《》]/g,''))}》</div><div class="a">${esc(w.author||'')}${w.genre?' · '+esc(w.genre):''}</div></div>`;
      const btn=src?`<button class="play" onclick="playWork('${esc(key)}',this)">▶ 播放</button>`:"";
      return `<div class="work">${meta}${btn}</div>`;
    }).join("")}</div></div>`;
  }
  // 拓展与探究：课外聆听（未列入正文作品的音频）
  const EX = (window.AUDIO_EXTRA && window.AUDIO_EXTRA[u.id]) || [];
  if(EX.length){
    h += `<div class="card"><h3>🎧 拓展聆听（选听）</h3><div class="works">${EX.map((x,i)=>
      `<div class="work"><div class="meta"><div class="n">${esc(x.name)}</div><div class="a">拓展与探究 · 课外聆听</div></div><button class="play" onclick="playExtra('${esc(u.id)}',${i},this)">▶ 播放</button></div>`
    ).join("")}</div></div>`;
  }
  // 配套资源（PPT 课件 + 教案）
  const R = (window.RESOURCES && window.RESOURCES[u.id]) || null;
  const MIR = (window.PPT_MIRROR && window.PPT_MIRROR.units && window.PPT_MIRROR.units[u.id]) || null;
  if(R && ((R.ppt&&R.ppt.length)||(R.jiaoan&&R.jiaoan.length))){
    const fsize = n => !n ? "" : (n>=1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(n/1024))+" KB");
    // PPT 的下载地址在 it.url（GitHub Release 附件）；it.path 只在本地打开网页时有效，
    // 线上是没有 media/ppt/ 这个目录的（2GB 超仓库上限，被 gitignore 了）——所以必须优先用 url。
    // mirror() 会把 github.com 的链接改写成国内可直连的加速镜像；教案走相对路径，不受影响。
    const row = (it,ic) => `<div class="res-item"><span class="nm">${ic} ${esc(it.name)}</span><span class="sz">${fsize(it.size)}</span><a class="rbtn" href="${esc(mirror(it.url || it.path))}" target="_blank" rel="noopener" download>下载 ↗</a></div>`;
    let inner = "";
    if(R.ppt && R.ppt.length){
      inner += `<div class="res-sub">📊 课件 PPT · ${R.ppt.length} 个</div><div class="res-list">${R.ppt.map(x=>row(x,"▫")).join("")}</div>`;
      if(MIR && MIR.url){
        inner += `<div class="zip-row"><a class="zip-btn" href="${esc(MIR.url)}" target="_blank" rel="noopener">📦 本单元课件打包下载</a>`
          +`<span class="zip-note">共 ${MIR.files||R.ppt.length} 个文件 · ${fsize(MIR.size)} · <b>微云分享，国内网络无需科学上网</b>；首次下载需扫码登录微云（微信/QQ 均可，一次即可）。</span></div>`;
      }
    }
    if(R.jiaoan && R.jiaoan.length) inner += `<div class="res-sub">📄 教案 Word · ${R.jiaoan.length} 份</div><div class="res-list">${R.jiaoan.map(x=>row(x,"▫")).join("")}</div>`;
    h += `<div class="card"><h3>📎 配套资源下载</h3>${inner}<div class="res-tip">PPT 有两条路，都<b>不用科学上网</b>：① <b>逐个文件的「下载 ↗」</b>走 GitHub 加速镜像，直接点就行（速度约 300KB/s，大文件请耐心等，支持断点续传）；② <b>「本单元课件打包下载」</b>走微云，一次拿全单元、速度更快，但<b>首次需要扫码登录微云</b>（微信/QQ 均可，一次即可）。某一条路临时不好使就换另一条。教案 Word 在站内直接下载，不受影响。文件都比较大，建议在电脑端下载。</div></div>`;
  }
  // 补充资料区（教师投稿）
  h += supportCard(u.id);
  if(u.worked){
    h += `<div class="card"><h3>🎯 聆听示范</h3><div style="white-space:pre-wrap;font-size:14px">${esc(u.worked)}</div></div>`;
  }
  if(u.takeaways.length){
    h += `<div class="card"><h3>✅ 学习要点</h3><ol class="clean">${u.takeaways.map(t=>`<li>${esc(t)}</li>`).join("")}</ol></div>`;
  }
  // 测验：优先用学考风格题库（EXAM_BANK），没覆盖到才回退到教材随堂题
  const QB = bankOf(u);
  const nAudio = QB.filter(q=>q.audio).length;
  h += `<div class="card quiz"><h3>✏️ 随堂练习（${QB.length} 题${nAudio?` · 含 ${nAudio} 道听辨`:""}）</h3>
        <div class="qnote">题型对齐河北省音乐学考理论知识部分（省统一机考、<b>只有选择题</b>）：四选一，单项选择。${nAudio?"带 🔊 的题目请<b>先听音频再作答</b>。":""}</div>
        <div class="progress"><i id="bar"></i></div>
        <div class="score" id="score">已完成 0 / ${QB.length}</div>
        <div id="qlist"></div>
        <div id="quizDone" class="hidden" style="margin-top:10px;font-weight:700;color:var(--brand2)"></div>
        </div>`;
  $("#content").innerHTML = h;
  renderQuiz(QB);
  markNav(u.id);
  window.scrollTo(0,0);
}

// 题库选择：EXAM_BANK 覆盖该单元就用它，否则退回教材自带的随堂题
function bankOf(u){
  const B = window.EXAM_BANK && window.EXAM_BANK.units && window.EXAM_BANK.units[u.id];
  return (B && B.length) ? B : u.quiz;
}

function renderQuiz(QB){
  const box = $("#qlist"); box.innerHTML=""; answered=new Set();
  QB.forEach((q,i)=>{
    const qd=document.createElement("div"); qd.className="q"; qd.dataset.i=i;
    let opts = q.options.map((o,j)=>`<button class="opt" data-j="${j}" onclick="sel(${i},${j})">${esc(o)}</button>`).join("");
    const tag = q.tag ? `<span class="qtag">${esc(q.tag)}</span>` : "";
    const au = q.audio ? `<button class="qaplay" onclick="playSrc('${esc(q.audio)}','听辨音频',this)">🔊 播放音频</button>` : "";
    qd.innerHTML = `<div class="qt">${i+1}. ${tag}${esc(q.q)}</div>${au}${opts}
      <div class="ex" id="ex${i}">💡 ${esc(q.explain)}</div>
      <div class="qbtns"><button class="submit" onclick="grade(${i},${q.answer})">提交</button>
      <button class="next" onclick="nextQ(${i})">下一题 ↓</button></div>`;
    box.appendChild(qd);
  });
}

let answered=new Set();
function sel(i,j){
  const qd=$(`#qlist .q[data-i="${i}"]`);
  qd.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  qd.querySelector(`.opt[data-j="${j}"]`).classList.add("sel");
}
function grade(i,ans){
  if(answered.has(i)) return;
  const qd = $(`#qlist .q[data-i="${i}"]`);
  const opts=[...qd.querySelectorAll(".opt")];
  opts.forEach(o=>{
    o.onclick=null;
    const j=+o.dataset.j;
    if(j===ans) o.classList.add("right");
    else if(o.classList.contains("sel")) o.classList.add("wrong");
  });
  $("#ex"+i).classList.add("show");
  $(".next",qd).style.display="inline-block";
  answered.add(i);
  updateScore();
}
function nextQ(i){
  const n=$(`#qlist .q[data-i="${i+1}"]`);
  if(n) n.scrollIntoView({behavior:"smooth",block:"center"});
}
function updateScore(){
  const cur = [...document.querySelectorAll("#qlist .q")].length;
  const done = answered.size;
  $("#score").textContent = `已完成 ${done} / ${cur}`;
  $("#bar").style.width = cur? (done/cur*100)+"%" : "0";
  if(cur && done===cur){
    const rights=[...document.querySelectorAll("#qlist .opt.right")].length;
    $("#quizDone").classList.remove("hidden");
    $("#quizDone").textContent = `🎉 本单元练习完成！正确 ${rights} / ${cur}（绿色为正确项，红色为你的误选）`;
  }
}

      <div class="card"><h3>📚 全书结构</h3><ul class="clean">

  if(v==="gloss"){

    let h=`<div class="card"><h3>🔤 全书术语速查（${D.glossary.length}）</h3>
      <input class="search" id="gsearch" placeholder="搜索术语，如：京剧 / 奏鸣曲式 / 山歌">
      <div class="gloss" id="glist"></div></div>`;
    $("#content").innerHTML=h;

      .map(g=>`<div class="g"><b>${esc(g.term)}</b> — ${esc(g.def)}</div>`).join("")};
    render(""); $("#gsearch").oninput=e=>render(e.target.value.trim());
    return;
  }
  if(v==="cheat"){
    crumb.textContent="对比速查";
    $("#content").innerHTML=`<div class="card"><h3>📊 对比速查表</h3>${D.cheatsheet}</div>`;
    return;
  }
  if(v==="exam"){
    crumb.textContent="学考模拟";
    if(exTimer){ clearInterval(exTimer); exTimer=null; }
    $("#content").innerHTML=`<div class="card">
      <h3>🎯 学考模拟（理论知识部分）</h3>
      <div class="exam-result">
        <p>按河北省普通高中学业水平合格性考试（音乐）<b>理论知识部分</b>的形式组卷：
        <b>省统一命题、计算机考试、全部为四选一选择题</b>，考试时长 <b>20 分钟</b>，
        理论知识满分 <b>50 分</b>，<b>60% 以上（30 分）为合格</b>；
        考查范围为人音版《音乐鉴赏》必修。</p>
        <p style="color:var(--muted)">题库依据公开的考试形式与教材内容自建，每题都可回溯到教材条目；
        <b>河北省不公开音乐学考真题</b>，本模拟卷不代表历年真题。</p>
      </div>
      <div class="qbtns" style="margin-top:14px">
        <button class="submit" onclick="startExam()">开始模拟（25 题 · 20 分钟 · 50 分）</button>
      </div>
      <div id="examBox"></div>
    </div>`;
    return;
  }
}

/* ───────────────────────── 学考模拟 ─────────────────────────
   依据：河北省音乐学考理论知识部分 = 省统一命题机考、只有选择题、20 分钟、满分 50 分、
   60% 合格。所以模拟卷固定 25 题 × 2 分 = 50 分，倒计时 20 分钟，到点自动交卷。 */
const EXAM_N=25, EXAM_MIN=20, EXAM_PER=2, EXAM_PASS=0.6;
let exQs=[], exAns={}, exTimer=null, exLeft=0, exOver=false;

function examShuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// 组卷：先保证「每个单元各来一题」，再补足题量。
// 机考会放音频，所以听辨题预留固定配额（太多会变成听力专卷，太少又不模拟机考）。
const EXAM_AUDIO = 5;
function examBuild(n){
  const B=(window.EXAM_BANK&&window.EXAM_BANK.units)||{};
  const ids=Object.keys(B).filter(id=>B[id]&&B[id].length);
  if(!ids.length) return [];
  const pools={}; ids.forEach(id=>pools[id]=examShuffle(B[id]));
  const taken=new Set(), paper=[];
  let audioLeft=Math.min(EXAM_AUDIO, n);

  // 第一轮：每单元 1 题，优先取该单元的听辨题（额度用完就优先取非听辨题）
  for(const id of examShuffle(ids)){
    if(paper.length>=n) break;
    const arr=pools[id];
    const wantAudio = audioLeft>0;
    let pick=-1;
    for(let i=0;i<arr.length;i++){ const q=arr[i]; if(!taken.has(q) && !!q.audio===wantAudio){ pick=i; break; } }
    if(pick<0) for(let i=0;i<arr.length;i++){ if(!taken.has(arr[i])){ pick=i; break; } }
    if(pick<0) continue;
    if(arr[pick].audio) audioLeft--;
    taken.add(arr[pick]); paper.push(arr[pick]);
  }

  // 第二轮：剩余名额随机补（仍然每次换一个单元开头，避免集中在题库大的单元）
  const draw=pred=>{
    for(const id of examShuffle(ids)){
      const arr=pools[id];
      for(let i=0;i<arr.length;i++){
        const q=arr[i];
        if(taken.has(q)) continue;
        if(pred && !pred(q)) continue;
        taken.add(q); return q;
      }
    }
    return null;
  };
  while(paper.length<n){ const q=draw(null); if(!q) break; paper.push(q); }
  return examShuffle(paper);
}

function startExam(){
  exQs=examBuild(EXAM_N); exAns={}; exOver=false;
  if(exTimer){ clearInterval(exTimer); exTimer=null; }
  if(!exQs.length){ $("#examBox").innerHTML='<div class="card">题库为空，请先运行 tools/gen_exam_bank.py 生成 exam_bank.js。</div>'; return; }
  exLeft=EXAM_MIN*60;
  const full=exQs.length*EXAM_PER, line=Math.round(full*EXAM_PASS);
  $("#examBox").innerHTML=`
    <div class="card">
      <div class="exam-head">
        <div>共 <b>${exQs.length}</b> 题 · 每题 ${EXAM_PER} 分 · 满分 <b>${full}</b> 分 · 合格线 <b>${line}</b> 分</div>
        <div class="exam-timer" id="exTimer">20:00</div>
      </div>
      <div class="exam-grid" id="exGrid"></div>
      <div class="qbtns" style="margin-top:12px">
        <button class="submit" id="exSubmitBtn" onclick="examSubmit(false)">交卷</button>
      </div>
    </div>
    <div id="exList">${exQs.map((q,i)=>{
      const opts=q.options.map((o,j)=>`<button class="opt" data-j="${j}" onclick="exPick(${i},${j})">${esc(o)}</button>`).join("");
      const tag=q.tag?`<span class="qtag">${esc(q.tag)}${q.sec?" · "+esc(q.sec):""}</span>`:"";
      const au=q.audio?`<button class="qaplay" onclick="playSrc('${esc(q.audio)}','听辨音频',this)">🔊 播放音频</button>`:"";
      return `<div class="card quiz" id="exq${i}"><div class="q"><div class="qt">${i+1}. ${tag}${esc(q.q)}</div>${au}${opts}</div></div>`;
    }).join("")}</div>`;
  examGrid();
  examPaint();
  exTimer=setInterval(examTick,1000);
}

function examPaint(){
  const t=$("#exTimer"); if(!t) return;
  const left=Math.max(exLeft,0);
  t.textContent=`${String(Math.floor(left/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
  t.classList.toggle("warn", left<=180);
}

function examGrid(){
  const g=$("#exGrid"); if(!g) return;
  g.innerHTML=exQs.map((q,i)=>`<button type="button" data-i="${i}" class="${exAns[i]!=null?'done':''}" onclick="exJump(${i})">${i+1}</button>`).join("");
}

function exPick(i,j){
  if(exOver) return;
  exAns[i]=j;
  const qd=$(`#exq${i} .q`);
  qd.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  qd.querySelector(`.opt[data-j="${j}"]`).classList.add("sel");
  examGrid();
}

function exJump(i){
  const el=$(`#exq${i}`);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
}

function examTick(){
  exLeft--;
  examPaint();
  if(exLeft<=0) examSubmit(true);
}

function examSubmit(auto){
  if(exOver) return;
  exOver=true;
  if(exTimer){ clearInterval(exTimer); exTimer=null; }
  let right=0; const wrong=[];
  exQs.forEach((q,i)=>{
    const mine = exAns[i];
    const ok = mine===q.answer;
    if(ok) right++; else wrong.push(i);
    const qd=$(`#exq${i} .q`);
    if(!qd) return;
    qd.querySelectorAll(".opt").forEach(o=>{
      o.onclick=null;
      const j=+o.dataset.j;
      if(j===q.answer) o.classList.add("right");
      else if(j===mine) o.classList.add("wrong");
    });
    const tip=document.createElement("div");
    tip.className="ex show";
    tip.innerHTML=`💡 ${esc(q.explain)}<div style="margin-top:6px;color:var(--muted);font-size:13px">正确答案：${esc(q.options[q.answer])}${mine!=null?` ｜ 你的选择：${esc(q.options[mine])}`:" ｜ 未作答"}</div>`;
    qd.appendChild(tip);
    const gb=$(`#exGrid button[data-i="${i}"]`);
    if(gb){ gb.classList.remove("done"); gb.classList.add(ok?"right":"wrong"); }
  });
  const total=exQs.length*EXAM_PER, score=right*EXAM_PER, line=Math.round(total*EXAM_PASS);
  const pass=score>=line;
  const head=$(".exam-head");
  if(head) head.innerHTML=`<div>已交卷${auto?"（时间到，自动交卷）":""} · 正确 <b>${right}</b> / ${exQs.length} 题</div><div class="exam-timer">${score} / ${total} 分</div>`;
  const btn=$("#exSubmitBtn");
  if(btn) btn.outerHTML='<button class="submit" onclick="startExam()">再来一套</button>';
  $("#examBox").insertAdjacentHTML("afterbegin",`<div class="card exam-result">
      <h3>${pass?"✅ 合格":"⚠️ 未达合格线"}</h3>
      <div>得分 <b>${score}</b> / ${total} 分（合格线 ${line} 分，即 60%）· 正确率 ${Math.round(right/exQs.length*100)}%</div>
      <div style="margin-top:8px;color:var(--muted);font-size:13px">${wrong.length?"错题已标红、解析展开在每题下方；点上方题号可快速跳转。":"全对，很稳。"}</div>
    </div>`);
  exJump(wrong.length?wrong[0]:0);
}

// ── 目录（侧栏）开关 ──────────────────────────────────────────────────────────
// 触发物是贴在目录右缘的小箭头（#sideToggle），不再是顶栏里的「☰ 目录」按钮。
// 手机（≤760px）：侧栏是固定浮层，.open 控制滑入滑出，并配一层遮罩。
// 桌面（>760px）：侧栏常驻，用 .app.side-collapsed 把它整个收起。
//   两种模式的状态由 sideIsOpen() 统一读出，再统一写成 .app.side-hidden —— 箭头方向、
//   箭头位置都只看这一个类，所以不会再出现"某种宽度下点了没反应"
//   （2026-09-22 的 bug：以前只在 >760px 之外定义了 .open，桌面端点它等于空操作）。
const isMobileSide = () => window.innerWidth <= 760;
function sideIsOpen(){
  return isMobileSide()
    ? $("#side").classList.contains("open")
    : !$(".app").classList.contains("side-collapsed");
}
function syncSideBtn(){
  const b = $("#sideToggle"), app = $(".app");
  if(!b) return;
  const open = sideIsOpen();
  if(app) app.classList.toggle("side-hidden", !open);
  b.setAttribute("aria-expanded", open ? "true" : "false");
  // 提示文案跟着状态走 —— 悬停就能看出"再点一下是收起还是展开"
  const label = open ? "收起目录" : "展开目录";
  b.setAttribute("aria-label", label);
  b.title = label;
}
function toggleSide(){
  const side = $("#side"), app = $(".app"), bd = $("#sideBackdrop");
  if(isMobileSide()){
    const on = side.classList.toggle("open");
    if(bd) bd.classList.toggle("show", on);
  } else {
    app.classList.toggle("side-collapsed");
  }
  syncSideBtn();
}
function closeSide(){
  const side = $("#side"), bd = $("#sideBackdrop");
  // 桌面端的常驻侧栏不在这里收起 —— 否则每点一个单元侧栏都会消失，反而碍事
  if(isMobileSide()){
    side.classList.remove("open");
    if(bd) bd.classList.remove("show");
  }
  syncSideBtn();
}
// 点遮罩 / 按 Esc 也能关
document.addEventListener("click", e=>{ if(e.target && e.target.id === "sideBackdrop") closeSide(); });
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeSide(); });
// 跨断点（旋转屏幕 / 拖窗口）时把两种模式的状态收拾干净，别互相残留
let _sideWasMobile = window.innerWidth <= 760;
window.addEventListener("resize", ()=>{
  const mob = isMobileSide();
  if(mob !== _sideWasMobile){
    _sideWasMobile = mob;
    $("#side").classList.remove("open");
    $(".app").classList.remove("side-collapsed");
    const bd = $("#sideBackdrop"); if(bd) bd.classList.remove("show");
  }
  syncSideBtn();
});

function setTheme(t){ document.documentElement.dataset.theme=t; localStorage.setItem("ma-theme",t);
  $("#themeBtn").textContent = t==="dark"?"☀️ 切换浅色":"🌓 切换深色"; }
$("#themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

// 校本便签（全局悬浮，仅存本机浏览器）
const NOTE_KEY="fyz_note_v1";
const noteArea=$("#noteArea"), notePanel=$("#notePanel"), noteSaved=$("#noteSaved");
noteArea.value=localStorage.getItem(NOTE_KEY)||"";
let noteTimer=null;
noteArea.addEventListener("input",()=>{
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>{
    localStorage.setItem(NOTE_KEY,noteArea.value);
    noteSaved.textContent="已保存 ✓";
    setTimeout(()=>noteSaved.textContent="",1500);
  },400);
});
$("#noteToggle").onclick=()=>notePanel.classList.toggle("hidden");
$("#noteClose").onclick=()=>notePanel.classList.add("hidden");
// 点面板以外的地方也收起（手机上更顺手）
document.addEventListener("click",e=>{
  if(notePanel.classList.contains("hidden")) return;
  if(notePanel.contains(e.target) || $("#noteToggle").contains(e.target)) return;
  notePanel.classList.add("hidden");
});
$("#noteClear").onclick=()=>{
  if(noteArea.value && !confirm("确定清空便签内容？")) return;
  noteArea.value=""; localStorage.removeItem(NOTE_KEY); noteSaved.textContent="已清空";
};

// init
buildNav();
syncSideBtn();              // 目录按钮的初始文案/aria 跟着实际状态走
setTheme(localStorage.getItem("ma-theme")||"light");
showView("home");
</script>
